[project]
name = "beyond4krjp"
version = "0.0.1"
description = "한국·일본 언론 바깥의 세계 보도 지형 분석"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
embed = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beyond"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
